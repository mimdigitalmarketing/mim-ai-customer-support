<!-- LEAD CAPTURE -->
<section class="lead-capture" id="contact">
  <div class="lead-capture-content">
    <span>LET’S BUILD SOMETHING SMART</span>

    <h2>Tell us what you want to automate.</h2>

    <p>
      Share a few details and MIM AI will review your requirement
      and get back to you.
    </p>

    <form id="leadCaptureForm" class="case-form">

      <div class="input-row">
        <input
          name="name"
          type="text"
          placeholder="Your name *"
          required
        >

        <input
          name="business_name"
          type="text"
          placeholder="Business name *"
          required
        >
      </div>

      <div class="input-row">
        <input
          name="email"
          type="email"
          placeholder="Email address *"
          required
        >

        <input
          name="phone"
          type="tel"
          placeholder="Phone / WhatsApp *"
          required
        >
      </div>

      <div class="input-row">
        <input
          name="website"
          type="url"
          placeholder="Website (optional)"
        >

        <input
          name="business_type"
          type="text"
          placeholder="Business type"
        >
      </div>

      <textarea
        name="requirement"
        rows="4"
        placeholder="What would you like to automate? *"
        required
      ></textarea>

      <button
        type="submit"
        id="leadSubmitButton"
      >
        Send my requirement →
      </button>

      <p
        id="leadFormMessage"
        role="status"
        aria-live="polite"
      ></p>

    </form>
  </div>
</section>
